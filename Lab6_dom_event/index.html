<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum DOM dan Event</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
 
<h1>Pendaftaran Workshop</h1>

<form id="formWorkshop" novalidate>

    <label for="namaWorkshop">Nama:</label>
    <input type="text" id="namaWorkshop" maxlength="50">

    <p>Jumlah karakter: <span id="jumlahNama">0</span></p>

    <label for="emailWorkshop">Email:</label>
    <input type="email" id="emailWorkshop">

    <br><br>

    <label for="sesiWorkshop">Pilih Sesi:</label>

    <select id="sesiWorkshop">
        <option value="">-- Pilih Sesi --</option>
        <option value="Pagi">Sesi Pagi</option>
        <option value="Siang">Sesi Siang</option>
        <option value="Sore">Sesi Sore</option>
    </select>

    <p id="pilihanSesi"></p>

    <button type="submit">Daftar</button>
    <button type="reset">Reset</button>

</form>

<p id="pesanWorkshop"></p>


</body>
</html>
